<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Запись на выходы</title>
<meta name="theme-color" content="#1b2a4e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<header id="top" hidden>
  <div class="brand">
    <span class="logo" aria-hidden="true">В</span>
    <div>
      <b>Запись на выходы</b>
      <small>НПД · ГПХ</small>
    </div>
  </div>
  <div class="hr">
    <span id="who" class="who"></span>
    <button type="button" id="refresh" class="icon-btn" title="Обновить" aria-label="Обновить"></button>
    <button type="button" id="logout" class="icon-btn" title="Выход" aria-label="Выход"></button>
  </div>
</header>
<main id="view"></main>
<nav id="tabs" hidden></nav>
<div id="sheet" hidden>
  <div class="sh" role="dialog" aria-modal="true">
    <div class="sh-handle" aria-hidden="true"></div>
    <button type="button" class="sh-x" id="shclose" aria-label="Закрыть"></button>
    <div id="shBody" class="sh-body"></div>
    <div id="shCta" class="sh-cta" hidden></div>
  </div>
</div>
<div id="toast" hidden></div>
<script src="config.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
